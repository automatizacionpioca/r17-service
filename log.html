.historyToolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}.historyToolbar p{margin:0}

.opBody{padding:14px 16px 16px}.opRow{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid #edf1f5}.opRow:last-child{border-bottom:0}.opRow span{color:#718093}.opRow b{color:#26384c;text-align:right}.opTotal b{color:#0d5db0;font-size:18px}
.pdfActions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.pdfBtn,.detailBtn,.updateBtn{border:1px solid #cfd9e5;background:#fff;color:#243448;border-radius:12px;padding:11px 10px;font-weight:800;cursor:pointer}.pdfBtn.share{background:#1769b5;color:#fff;border-color:#1769b5}.detailBtn,.updateBtn{width:100%;margin-top:12px}.updateBtn{background:#eef8f0;border-color:#bcdcc4;color:#25683a}

button.opIconBtn:focus-visible{outline:2px solid #246fb0;outline-offset:2px}.errorBox{background:#fff1f1;color:#a42b2b;border:1px solid #f0caca;border-radius:14px;padding:14px}.loadingBox,.emptyBox{background:#f7f9fc;color:#68788b;border:1px solid #dfe6ee;border-radius:14px;padding:18px;text-align:center}

<script>
const HISTORY_URL='https://apxrmkdegjnblkbyjsbp.supabase.co/functions/v1/r17-history';
const ISSUE_URL='https://apxrmkdegjnblkbyjsbp.supabase.co/functions/v1/r17-issue';
const SUPABASE_PUBLISHABLE='sb_publishable_htgEX8HiRGAjpCVhPw1gfg_tOPxkJoI';
const CFG_KEY='r17_cfg_v1';
const historyById=new Map();
function money(v){return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(v)||0)}
function minutesText(value){const min=Math.max(0,Math.round(Number(value)||0));const h=Math.floor(min/60),m=min%60;if(h&&m)return h+' h '+m+' min';if(h)return h+' h';return m+' min'}
function dateText(iso){if(!iso)return '—';const d=new Date(iso);return new Intl.DateTimeFormat('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(d)}
function escapeHtml(value){return String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function readConfig(){try{return JSON.parse(localStorage.getItem(CFG_KEY)||'{}')}catch(e){return {}}}
async function fetchHistory(){const response=await fetch(HISTORY_URL,{method:'GET',headers:{apikey:SUPABASE_PUBLISHABLE,Authorization:'Bearer '+SUPABASE_PUBLISHABLE}});let data=null;try{data=await response.json()}catch(e){throw new Error('La función de Historial respondió con un formato inválido.')}if(!response.ok||!data.ok){const detail=data&&data.detail?' · '+data.detail:'';throw new Error((data&&data.error?data.error:'No se pudo cargar el historial')+detail)}return Array.isArray(data.items)?data.items:[]}
function travelModeLabelFromSnapshot(item){
  const snap=item.snapshot||{};
  if(snap.travel_billing_mode==='double_visit')return 'Reparación – doble visita (4 trayectos)';
  if(snap.travel_billing_mode==='one_way')return 'Solo ida (1 trayecto)';
  if(snap.travel_billing_mode==='round_trip')return 'Ida y vuelta (2 trayectos)';
  if(snap.return_travel_time_computed===false)return 'Histórico: kilómetros ida y vuelta; tiempo solo ida';
  return 'Ida y vuelta (modalidad anterior)';
}
function billedTravelKm(item){
  const snap=item.snapshot||{};
  if(snap.billed_distance_km!==undefined && snap.billed_distance_km!==null)return Number(snap.billed_distance_km)||0;
  return Number(item.round_trip_km)||0; // Los reportes anteriores cobraban siempre km ida y vuelta.
}
function totalEmployed(item){const snap=item.snapshot||{};if(snap.total_employed_minutes!==undefined)return Number(snap.total_employed_minutes)||0;return (Number(item.round_trip_minutes)||0)+(Number(item.labor_minutes)||0)}
function itemsSummary(item){const items=Array.isArray(item.items)?item.items:[];if(!items.length)return 'Sin accesorios / repuestos';return items.map(x=>(Number(x.qty)||0)+' × '+(x.desc||'Ítem')).join(' · ')}
function internalDetail(item){const snap=item.snapshot||{},rates=snap.rates||{},prices=snap.prices||{};return `<div class="internal hidden" id="internal-${escapeHtml(item.id)}"><div class="internalTitle">Detalle interno</div><div class="opRow"><span>Modalidad de traslado</span><b>${escapeHtml(travelModeLabelFromSnapshot(item))}</b></div><div class="opRow"><span>Kilómetros facturados</span><b>${billedTravelKm(item).toFixed(1)} km</b></div><div class="opRow"><span>Distancia ida</span><b>${(Number(item.one_way_km)||0).toFixed(1)} km</b></div><div class="opRow"><span>Distancia ida y vuelta</span><b>${(Number(item.round_trip_km)||0).toFixed(1)} km</b></div><div class="opRow"><span>Traslado</span><b>${minutesText(snap.billed_travel_minutes!==undefined?snap.billed_travel_minutes:item.round_trip_minutes)}</b></div><div class="opRow"><span>Trabajo</span><b>${minutesText(item.labor_minutes)}</b></div><div class="opRow"><span>Peajes</span><b>${Number(item.toll_count)||0}</b></div><div class="opRow"><span>Valor/km usado</span><b>${money(rates.km)}</b></div><div class="opRow"><span>Hora traslado usada</span><b>${money(rates.travel_hour)}</b></div><div class="opRow"><span>Hora mano de obra usada</span><b>${money(rates.labor_hour)}</b></div><div class="opRow"><span>Diferencial facturado</span><b>${Number(prices.transfer_surcharge_percent??12)}%</b></div><div class="opRow"><span>Catálogo</span><b>V${snap.catalog_version??'—'}</b></div></div>`}
function cardHtml(item){const snap=item.snapshot||{};const type=item.mode==='service'?'Servicio en domicilio':'Cotización anticipada';const address=item.customer_address||'Sin ubicación';const employed=totalEmployed(item);const cash=Number(item.total_cash_rounded)||0;const invoice=Number(item.total_invoice)||0;const updateBadge=(snap.updated_from_id?'<span class="opUpdate">Actualización de catálogo</span>':'')+(snap.edited_at?'<span class="opUpdate">Reporte editado</span>':'');const hasItems=Array.isArray(item.items)&&item.items.length>0;return `<article class="opCard"><div class="opHead"><div class="opTopline"><div class="opDate">${dateText(item.created_at)}</div><div class="opAdminActions"><button type="button" class="opIconBtn opEdit" title="Editar reporte" aria-label="Editar reporte" onclick="editReport('${escapeHtml(item.id)}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L9 17l-4 1 1-4z"/></svg></button><button type="button" class="opIconBtn opDelete" title="Eliminar reporte" aria-label="Eliminar reporte" onclick="deleteReport('${escapeHtml(item.id)}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div><div class="opAddress">${escapeHtml(address)}</div><span class="opType">${type}</span>${updateBadge}</div><div class="opBody"><div class="opRow"><span>Kilómetros computados</span><b>${billedTravelKm(item).toFixed(1)} km</b></div><div class="opRow"><span>Modalidad de traslado</span><b>${escapeHtml(travelModeLabelFromSnapshot(item))}</b></div><div class="opRow"><span>Tiempo empleado</span><b>${minutesText(employed)}</b></div><div class="opRow"><span>Accesorios / repuestos</span><b>${escapeHtml(itemsSummary(item))}</b></div><div class="opRow opTotal"><span>Precio efectivo</span><b>${money(cash)}</b></div><div class="opRow opTotal"><span>Final IVA incluido</span><b>${money(invoice)}</b></div><div class="pdfActions"><button class="pdfBtn" type="button" onclick="openHistoryPdf('${escapeHtml(item.id)}')">Ver PDF</button><button class="pdfBtn share" type="button" onclick="shareHistoryPdf('${escapeHtml(item.id)}')">Compartir PDF</button><button class="pdfBtn" style="grid-column:1/-1" type="button" onclick="copyHistoryMessage(this)">Copiar mensaje</button></div>${hasItems?`<button class="updateBtn" type="button" onclick="updateCatalogPrices('${escapeHtml(item.id)}',this)">ACTUALIZAR ACCESORIOS A CATÁLOGO VIGENTE</button>`:''}<button class="detailBtn" type="button" onclick="toggleInternal('${escapeHtml(item.id)}',this)">Ver detalle interno</button>${internalDetail(item)}</div></article>`}
async function issue(payload){const response=await fetch(ISSUE_URL,{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_PUBLISHABLE,Authorization:'Bearer '+SUPABASE_PUBLISHABLE},body:JSON.stringify(payload)});const data=await response.json();if(!response.ok||!data.ok)throw new Error(data&&data.error?data.error:'No se pudo guardar la actualización');return data}
function aggregateIva(rows){
  const map=new Map();
  rows.forEach(row=>{
    const pct=Math.max(0,Number(row.percent)||0);
    const key=String(pct);
    const current=map.get(key)||{percent:pct,base:0,amount:0};
    current.base+=Number(row.base)||0;
    current.amount+=Number(row.amount)||0;
    map.set(key,current);
  });
  return [...map.values()].filter(x=>x.base>0||x.amount>0).sort((a,b)=>b.percent-a.percent);
}

function updatedCatalogPayload(item){
  const snap=item.snapshot||{};
  const prices=snap.prices||{};
  const rates=snap.rates||{};
  const cfg=readConfig();
  const oldItems=Array.isArray(item.items)?item.items:[];
  let matched=0,unmatched=0;

  const newItems=oldItems.map(old=>{
    const found=(old.catalog_code&&PiocaCatalog.findByCode(old.catalog_code)) || PiocaCatalog.findMatch(old.catalog_product||old.desc);
    if(!found){
      unmatched++;
      return {...old};
    }
    matched++;
    return {
      ...old,
      source:'catalog',
      catalog_code:found.code,
      catalog_category:found.category,
      catalog_supplier:found.supplier||null,
      catalog_product:found.product,
      desc:found.description||found.product,
      price:found.cashPrice,
      iva_percent:PiocaCatalog.productIvaPercent(found,10.5)
    };
  });

  if(!matched) throw new Error('No pude vincular ningún accesorio de este presupuesto con el catálogo vigente.');

  const oldParts=oldItems.reduce((sum,x)=>sum+(Number(x.qty)||0)*(Number(x.price)||0),0);
  const newParts=newItems.reduce((sum,x)=>sum+(Number(x.qty)||0)*(Number(x.price)||0),0);
  const visitRounded=prices.visit_labor_rounded!==undefined
    ? Number(prices.visit_labor_rounded)||0
    : Math.max(0,(Number(item.total_cash_rounded)||0)-oldParts);
  const visitRaw=prices.visit_labor_raw!==undefined
    ? Number(prices.visit_labor_raw)||0
    : (Number(item.visit_labor_raw)||visitRounded);

  // Actualización SOLO de catálogo: conserva el diferencial comercial y el IVA de servicio
  // usados por el presupuesto original. Cambian únicamente precio/IVA de los productos vinculados.
  const pct=Number(prices.transfer_surcharge_percent??12)||0;
  const factor=1+pct/100;
  const serviceIva=Number(prices.service_iva_percent??item.iva_percent??prices.iva_percent??PiocaCatalog.ivaPercent(cfg))||0;
  const serviceBase=prices.service_transfer_base!==undefined
    ? Number(prices.service_transfer_base)||0
    : visitRounded*factor;
  const serviceIvaAmount=prices.service_iva_amount!==undefined
    ? Number(prices.service_iva_amount)||0
    : serviceBase*(serviceIva/100);

  let partsBase=0;
  let partsIva=0;
  const ivaRows=[{percent:serviceIva,base:serviceBase,amount:serviceIvaAmount}];
  const calculatedItems=newItems.map(x=>{
    const qty=Math.max(1,Number(x.qty)||1);
    const cashTotal=qty*(Number(x.price)||0);
    const base=cashTotal*factor;
    const ivaPct=Number(x.iva_percent??10.5)||0;
    const ivaAmount=base*(ivaPct/100);
    const total=base+ivaAmount;
    partsBase+=base;
    partsIva+=ivaAmount;
    ivaRows.push({percent:ivaPct,base,amount:ivaAmount});
    return {...x,iva_percent:ivaPct,invoice_base:base,iva_amount:ivaAmount,invoice_total:total};
  });

  const cashRounded=visitRounded+newParts;
  const totalCashRaw=visitRaw+newParts;
  const transferBase=serviceBase+partsBase;
  const ivaAmount=serviceIvaAmount+partsIva;
  const totalInvoice=transferBase+ivaAmount;
  const ivaBreakdown=aggregateIva(ivaRows);

  const payload={
    mode:item.mode,
    customer_address:item.customer_address,
    customer_place_id:item.customer_place_id||null,
    service_lat:item.service_lat??null,
    service_lng:item.service_lng??null,
    started_at:item.started_at??null,
    finished_at:item.finished_at??null,
    one_way_km:Number(item.one_way_km)||0,
    round_trip_km:Number(item.round_trip_km)||0,
    one_way_minutes:Number(item.one_way_minutes)||0,
    round_trip_minutes:Number(item.round_trip_minutes)||0,
    labor_minutes:Number(item.labor_minutes)||0,
    toll_count:Number(item.toll_count)||0,
    items:calculatedItems,
    rate_km:Number(item.rate_km??rates.km)||0,
    rate_travel_hour:Number(item.rate_travel_hour??rates.travel_hour)||0,
    rate_labor_hour:Number(item.rate_labor_hour??rates.labor_hour)||0,
    rate_toll:Number(item.rate_toll??rates.toll)||0,
    iva_percent:serviceIva,
    cost_km:Number(item.cost_km)||0,
    cost_travel:Number(item.cost_travel)||0,
    cost_labor:Number(item.cost_labor)||0,
    cost_tolls:Number(item.cost_tolls)||0,
    cost_items:newParts,
    visit_labor_raw:visitRaw,
    total_cash_raw:totalCashRaw,
    total_cash_rounded:cashRounded,
    transfer_base:transferBase,
    iva_amount:ivaAmount,
    total_invoice:totalInvoice,
    pdf_version:'r17-pdf-v6-catalogo-iva-mixto-sin-distancia',
    pdf_name:'piOca_Resumen_Servicio.pdf',
    snapshot:{
      ...snap,
      updated_from_id:String(item.id),
      update_type:'catalog_only',
      updated_at:new Date().toISOString(),
      catalog_version:PiocaCatalog.load().version,
      tax_model:'mixed_v2',
      items:calculatedItems,
      prices:{
        ...prices,
        parts:newParts,
        total_cash_raw:totalCashRaw,
        total_cash_rounded:cashRounded,
        transfer_surcharge_percent:pct,
        transfer_surcharge_amount:transferBase-cashRounded,
        transfer_base:transferBase,
        service_iva_percent:serviceIva,
        service_transfer_base:serviceBase,
        service_iva_amount:serviceIvaAmount,
        parts_transfer_base:partsBase,
        parts_iva_amount:partsIva,
        iva_breakdown:ivaBreakdown,
        iva_percent:serviceIva,
        iva_amount:ivaAmount,
        total_invoice:totalInvoice
      },
      rates:{...rates}
    }
  };
  return {payload,matched,unmatched};
}

async function updateCatalogPrices(id,btn){const item=historyById.get(id);if(!item)return;const cat=PiocaCatalog.load();if(!cat.items.length){alert('Primero importá el catálogo desde Configuración.');return}if(!confirm('Se creará una NUEVA versión del presupuesto. Solo se actualizarán precio e IVA de los accesorios vinculados al catálogo. Kilómetros, mano de obra, traslado, tiempo y diferencial comercial quedan iguales.'))return;const old=btn.textContent;btn.disabled=true;btn.textContent='ACTUALIZANDO…';try{const result=updatedCatalogPayload(item);await issue(result.payload);alert('Presupuesto actualizado. Accesorios actualizados: '+result.matched+(result.unmatched?' · Sin vincular: '+result.unmatched:'')+'. El original quedó intacto.');await loadHistory()}catch(e){alert('No se pudo actualizar: '+(e.message||String(e)))}finally{btn.disabled=false;btn.textContent=old}}
async function openHistoryPdf(id){const item=historyById.get(id);if(!item)return;try{await PiocaPDF.openPdf(item)}catch(e){alert('No se pudo abrir el PDF: '+(e.message||String(e)))}}
async function shareHistoryPdf(id){const item=historyById.get(id);if(!item)return;try{const result=await PiocaPDF.sharePdf(item);if(result&&result.messageCopied)alert('PDF compartido. El mensaje quedó copiado por si WhatsApp no lo agrega automáticamente.')}catch(e){if(e&&e.name==='AbortError')return;alert('No se pudo compartir el PDF: '+(e.message||String(e)))}}
async function copyHistoryMessage(btn){const original=btn.textContent;try{const ok=await PiocaPDF.copyMessage();btn.textContent=ok?'Mensaje copiado':'No se pudo copiar'}catch(e){btn.textContent='No se pudo copiar'}setTimeout(()=>btn.textContent=original,1800)}
function toggleInternal(id,btn){const box=document.getElementById('internal-'+id);if(!box)return;const hidden=box.classList.toggle('hidden');btn.textContent=hidden?'Ver detalle interno':'Ocultar detalle interno'}
async function loadHistory(){const list=document.getElementById('historyList');list.innerHTML='<div class="loadingBox">Cargando historial…</div>';document.getElementById('refreshBtn').disabled=true;try{const items=await fetchHistory();if(!items.length){list.innerHTML='<div class="emptyBox">Todavía no hay operaciones emitidas.</div>';return}historyById.clear();items.forEach(item=>historyById.set(String(item.id),item));list.innerHTML=items.map(cardHtml).join('')}catch(e){list.innerHTML='<div class="errorBox">'+escapeHtml(e.message||String(e))+'</div>'}finally{document.getElementById('refreshBtn').disabled=false}}

const MANAGE_URL='https://apxrmkdegjnblkbyjsbp.supabase.co/functions/v1/r17-manage';
const R17_PIN_SESSION_KEY='pioca_admin_pin_session';
let r17ManagementKey='';
function r17AskManagementKey(){
  if(r17ManagementKey) return r17ManagementKey;
  try{r17ManagementKey=sessionStorage.getItem(R17_PIN_SESSION_KEY)||'';}catch(e){}
  if(/^\d{6}$/.test(r17ManagementKey))return r17ManagementKey;
  r17ManagementKey='';
  const key=prompt('PIN de administrador (6 números):');
  if(key===null||key==='')return '';
  if(!/^\d{6}$/.test(String(key).trim()))throw new Error('El PIN debe tener exactamente 6 números.');
  r17ManagementKey=String(key).trim();
  try{sessionStorage.setItem(R17_PIN_SESSION_KEY,r17ManagementKey);}catch(e){}
  return r17ManagementKey;
}
async function r17Manage(body){
  const key=r17AskManagementKey();
  if(!key) throw new Error('Acción cancelada. No se ingresó el PIN.');
  const response=await fetch(MANAGE_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_PUBLISHABLE,'Authorization':'Bearer '+SUPABASE_PUBLISHABLE},
    body:JSON.stringify({...body,admin_key:key})
  });
  let data;try{data=await response.json()}catch(e){throw new Error('Respuesta inválida del servidor.');}
  if(!response.ok||!data.ok){
    if(response.status===401||response.status===403){r17ManagementKey='';try{sessionStorage.removeItem(R17_PIN_SESSION_KEY)}catch(e){}}
    throw new Error((data.error||'No se pudo completar la operación')+(data.detail?' · '+data.detail:''));
  }
  return data;
}
function editReport(id){
  window.location.href='edit.html?id='+encodeURIComponent(id);
}
async function deleteReport(id){
  const item=historyById.get(String(id));
  if(!item) return;
  if(!confirm('¿Eliminar definitivamente el reporte de '+(item.customer_address||'este servicio')+'? Esta acción NO se puede deshacer.')) return;
  if(!confirm('CONFIRMACIÓN FINAL: ¿Borrar este reporte del historial de forma permanente?')) return;
  try{
    await r17Manage({action:'delete',id});
    try{
      const current=JSON.parse(localStorage.getItem('r17_last_issued_v1')||'null');
      if(current&&String(current.id)===String(id))localStorage.removeItem('r17_last_issued_v1');
    }catch(e){}
    await loadHistory();
    alert('Reporte eliminado definitivamente.');
  }catch(e){alert('No se eliminó el reporte: '+(e.message||String(e)));}
}

document.getElementById('refreshBtn').onclick=loadHistory;loadHistory();
</script></body></html>
