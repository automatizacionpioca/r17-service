name: Compilar piOca Cotizador APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK 35
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: No se encontró sdkmanager dentro de $ANDROID_SDK_ROOT"
            find "$ANDROID_SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi

          echo "Usando sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"

          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"

          echo "Android SDK 35 listo."

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validar archivos y firma
        env:
          COTIZADOR_KEYSTORE_B64: ${{ secrets.COTIZADOR_KEYSTORE_B64 }}
          COTIZADOR_KEYSTORE_PASS: ${{ secrets.COTIZADOR_KEYSTORE_PASS }}
        run: |
          set -e
          test -f icon-cotizador-pioca.png || { echo "Falta icon-cotizador-pioca.png en la raíz del repositorio"; exit 1; }
          test -n "$COTIZADOR_KEYSTORE_B64" || { echo "Falta el secret COTIZADOR_KEYSTORE_B64"; exit 1; }
          test -n "$COTIZADOR_KEYSTORE_PASS" || { echo "Falta el secret COTIZADOR_KEYSTORE_PASS"; exit 1; }

      - name: Crear proyecto Android
        shell: bash
        run: |
          set -e

          rm -rf android-cotizador
          mkdir -p android-cotizador/app/src/main/java/ar/com/pioca/cotizador
          mkdir -p android-cotizador/app/src/main/res/xml
          mkdir -p android-cotizador/app/src/main/res/values
          mkdir -p android-cotizador/app/src/main/res/mipmap-mdpi
          mkdir -p android-cotizador/app/src/main/res/mipmap-hdpi
          mkdir -p android-cotizador/app/src/main/res/mipmap-xhdpi
          mkdir -p android-cotizador/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-cotizador/app/src/main/res/mipmap-xxxhdpi

          cat > android-cotizador/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'piOcaCotizador'
          include ':app'
          EOF

          cat > android-cotizador/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > android-cotizador/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > android-cotizador/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ar.com.pioca.cotizador'
              compileSdk 35

              defaultConfig {
                  applicationId 'ar.com.pioca.cotizador'
                  minSdk 26
                  targetSdk 35
                  versionCode 2
                  versionName '1.1-catalogo'
              }

              signingConfigs {
                  release {
                      storeFile file(System.getenv('COTIZADOR_KEYSTORE_PATH'))
                      storePassword System.getenv('COTIZADOR_KEYSTORE_PASS')
                      keyAlias 'pioca'
                      keyPassword System.getenv('COTIZADOR_KEYSTORE_PASS')
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      signingConfig signingConfigs.release
                  }
              }
          }

          dependencies {
              implementation 'androidx.core:core:1.15.0'
          }
          EOF

          cat > android-cotizador/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">piOca Cotizador</string>
          </resources>
          EOF

          cat > android-cotizador/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

          cat > android-cotizador/app/src/main/res/xml/file_paths.xml <<'EOF'
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="shared" path="shared/" />
          </paths>
          EOF

          cat > android-cotizador/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <application
                  android:allowBackup="true"
                  android:fullBackupContent="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="piOca Cotizador"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".BackgroundLocationService"
                      android:exported="false"
                      android:foregroundServiceType="location"
                      android:stopWithTask="false" />

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="ar.com.pioca.cotizador.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

              </application>
          </manifest>
          EOF

          cat > android-cotizador/app/src/main/java/ar/com/pioca/cotizador/MainActivity.java <<'EOF'
          package ar.com.pioca.cotizador;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.BroadcastReceiver;
          import android.content.ClipData;
          import android.content.Context;
          import android.content.Intent;
          import android.content.ContentValues;
          import android.content.IntentFilter;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.os.Environment;
          import android.provider.Settings;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.ValueCallback;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import androidx.core.content.FileProvider;

          import org.json.JSONObject;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          public class MainActivity extends Activity {

              private static final String APP_URL = "https://automatizacionpioca.github.io/r17-service/";
              private static final String SERVICE_KEY = "r17_active_v1";
              public static final String ACTION_AUTO_FINISH = "ar.com.pioca.cotizador.AUTO_FINISH";

              private static final int REQ_LOCATION = 1001;
              private static final int REQ_BACKGROUND = 1002;
              private static final int REQ_NOTIFICATIONS = 1003;
              private static final int REQ_FILE_CHOOSER = 1004;

              private WebView webView;
              private boolean pageReady = false;
              private boolean backgroundDialogShown = false;
              private boolean batteryDialogShown = false;
              private GeolocationPermissions.Callback pendingGeoCallback;
              private String pendingGeoOrigin;
              private ValueCallback<Uri[]> filePathCallback;

              private final BroadcastReceiver autoFinishReceiver = new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context context, Intent intent) {
                      applyPendingAutoFinish();
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setGeolocationEnabled(true);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(true);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);

                  webView.addJavascriptInterface(new NativeBridge(), "AndroidCotizador");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          pageReady = true;
                          installNativeHooks();
                          applyPendingAutoFinish();
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(
                              String origin,
                              GeolocationPermissions.Callback callback) {

                          if (hasFineLocation()) {
                              callback.invoke(origin, true, false);
                          } else {
                              pendingGeoOrigin = origin;
                              pendingGeoCallback = callback;
                              requestLocationPermission();
                          }
                      }

                      @Override
                      public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> callback,
                              FileChooserParams fileChooserParams) {

                          if (filePathCallback != null) {
                              filePathCallback.onReceiveValue(null);
                          }
                          filePathCallback = callback;

                          try {
                              Intent intent = fileChooserParams.createIntent();
                              intent.addCategory(Intent.CATEGORY_OPENABLE);
                              startActivityForResult(intent, REQ_FILE_CHOOSER);
                              return true;
                          } catch (Exception e) {
                              filePathCallback = null;
                              return false;
                          }
                      }
                  });

                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(
                              autoFinishReceiver,
                              new IntentFilter(ACTION_AUTO_FINISH),
                              Context.RECEIVER_NOT_EXPORTED
                      );
                  } else {
                      registerReceiver(autoFinishReceiver, new IntentFilter(ACTION_AUTO_FINISH));
                  }

                  webView.loadUrl(APP_URL);
                  webView.postDelayed(this::beginPermissionFlow, 800);
              }

              private boolean hasFineLocation() {
                  return checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)
                          == PackageManager.PERMISSION_GRANTED;
              }

              private boolean hasBackgroundLocation() {
                  if (Build.VERSION.SDK_INT < 29) return true;
                  return checkSelfPermission(Manifest.permission.ACCESS_BACKGROUND_LOCATION)
                          == PackageManager.PERMISSION_GRANTED;
              }

              private void requestLocationPermission() {
                  requestPermissions(
                          new String[]{
                                  Manifest.permission.ACCESS_FINE_LOCATION,
                                  Manifest.permission.ACCESS_COARSE_LOCATION
                          },
                          REQ_LOCATION
                  );
              }

              private void beginPermissionFlow() {
                  if (!hasFineLocation()) {
                      requestLocationPermission();
                      return;
                  }

                  if (Build.VERSION.SDK_INT >= 29 && !hasBackgroundLocation() && !backgroundDialogShown) {
                      maybeAskBackgroundLocation();
                      return;
                  }

                  if (Build.VERSION.SDK_INT >= 33 &&
                          checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
                                  != PackageManager.PERMISSION_GRANTED) {
                      maybeAskNotifications();
                      return;
                  }

                  maybeAskBatteryOptimization();
              }

              private void maybeAskBackgroundLocation() {
                  if (Build.VERSION.SDK_INT < 29 || hasBackgroundLocation()) return;

                  if (Build.VERSION.SDK_INT == 29) {
                      requestPermissions(
                              new String[]{Manifest.permission.ACCESS_BACKGROUND_LOCATION},
                              REQ_BACKGROUND
                      );
                      return;
                  }

                  if (backgroundDialogShown) return;
                  backgroundDialogShown = true;

                  new AlertDialog.Builder(this)
                          .setTitle("Permitir ubicación permanente")
                          .setMessage(
                                  "Para finalizar automáticamente un servicio aunque bloquees o cierres la app, " +
                                  "habilitá Ubicación y elegí ‘Permitir todo el tiempo’."
                          )
                          .setPositiveButton("ABRIR AJUSTES", (d, which) -> {
                              Intent i = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);
                              i.setData(Uri.parse("package:" + getPackageName()));
                              startActivity(i);
                          })
                          .setNegativeButton("AHORA NO", null)
                          .show();
              }

              private void maybeAskNotifications() {
                  if (Build.VERSION.SDK_INT >= 33 &&
                          checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
                                  != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                              new String[]{Manifest.permission.POST_NOTIFICATIONS},
                              REQ_NOTIFICATIONS
                      );
                  }
              }

              private void maybeAskBatteryOptimization() {
                  if (batteryDialogShown) return;

                  PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                  if (pm != null && pm.isIgnoringBatteryOptimizations(getPackageName())) return;

                  batteryDialogShown = true;

                  new AlertDialog.Builder(this)
                          .setTitle("Permitir funcionamiento en segundo plano")
                          .setMessage(
                                  "Para que el control de ubicación siga activo con la pantalla bloqueada, " +
                                  "conviene excluir piOca Cotizador del ahorro de batería."
                          )
                          .setPositiveButton("PERMITIR", (d, which) -> {
                              try {
                                  Intent i = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                                  i.setData(Uri.parse("package:" + getPackageName()));
                                  startActivity(i);
                              } catch (Exception e) {
                                  Intent i = new Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS);
                                  startActivity(i);
                              }
                          })
                          .setNegativeButton("AHORA NO", null)
                          .show();
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      String[] permissions,
                      int[] grantResults) {

                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);

                  if (requestCode == REQ_LOCATION) {
                      boolean granted = hasFineLocation();

                      if (pendingGeoCallback != null && pendingGeoOrigin != null) {
                          pendingGeoCallback.invoke(pendingGeoOrigin, granted, false);
                          pendingGeoCallback = null;
                          pendingGeoOrigin = null;
                      }

                      if (granted) {
                          beginPermissionFlow();
                      }
                  } else if (requestCode == REQ_BACKGROUND || requestCode == REQ_NOTIFICATIONS) {
                      beginPermissionFlow();
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == REQ_FILE_CHOOSER) {
                      Uri[] result = null;
                      if (resultCode == RESULT_OK && data != null && data.getData() != null) {
                          result = new Uri[]{data.getData()};
                      }
                      if (filePathCallback != null) {
                          filePathCallback.onReceiveValue(result);
                          filePathCallback = null;
                      }
                  }
              }

              private void installNativeHooks() {
                  String js =
                          "(function(){" +
                          "try{" +
                          "if(!window.__piocaNativeHook){" +
                          "window.__piocaNativeHook=true;" +
                          "var _set=Storage.prototype.setItem;" +
                          "Storage.prototype.setItem=function(k,v){" +
                          "var r=_set.apply(this,arguments);" +
                          "try{if(this===localStorage&&k==='" + SERVICE_KEY + "'&&window.AndroidCotizador){AndroidCotizador.syncServiceState(String(v));}}catch(e){}" +
                          "return r;};" +
                          "var _remove=Storage.prototype.removeItem;" +
                          "Storage.prototype.removeItem=function(k){" +
                          "var r=_remove.apply(this,arguments);" +
                          "try{if(this===localStorage&&k==='" + SERVICE_KEY + "'&&window.AndroidCotizador){AndroidCotizador.syncServiceState('');}}catch(e){}" +
                          "return r;};" +
                          "var nativeShare=function(data){return new Promise(function(resolve,reject){" +
                          "try{" +
                          "var f=data&&data.files&&data.files[0];" +
                          "if(!f){reject(new Error('No hay archivo para compartir'));return;}" +
                          "var reader=new FileReader();" +
                          "reader.onload=function(){try{AndroidCotizador.sharePdf(String(reader.result),f.name||'piOca.pdf',(data&&data.text)||'');resolve();}catch(e){reject(e);}};" +
                          "reader.onerror=function(){reject(reader.error||new Error('No se pudo leer el PDF'));};" +
                          "reader.readAsDataURL(f);" +
                          "}catch(e){reject(e);}" +
                          "});};" +
                          "try{Object.defineProperty(navigator,'share',{configurable:true,value:nativeShare});}catch(e){try{navigator.share=nativeShare;}catch(x){}}" +
                          "var nativeCanShare=function(){return true;};" +
                          "try{Object.defineProperty(navigator,'canShare',{configurable:true,value:nativeCanShare});}catch(e){try{navigator.canShare=nativeCanShare;}catch(x){}}" +
                          "if(window.PiocaPDF&&!window.PiocaPDF.__nativeSharePatched){" +
                          "window.PiocaPDF.__nativeSharePatched=true;" +

                          "window.PiocaPDF.openPdf=async function(record){" +
                          "var blob=await window.PiocaPDF.build(record);" +
                          "var name=window.PiocaPDF.fileName(record);" +
                          "return await new Promise(function(resolve,reject){" +
                          "var reader=new FileReader();" +
                          "reader.onload=function(){try{AndroidCotizador.viewPdf(String(reader.result),name);resolve(true);}catch(e){reject(e);}};" +
                          "reader.onerror=function(){reject(reader.error||new Error('No se pudo leer el PDF'));};" +
                          "reader.readAsDataURL(blob);" +
                          "});" +
                          "};" +

                          "window.PiocaPDF.sharePdf=async function(record){" +
                          "var blob=await window.PiocaPDF.build(record);" +
                          "var name=window.PiocaPDF.fileName(record);" +
                          "var msg=window.PiocaPDF.message||'';" +
                          "return await new Promise(function(resolve,reject){" +
                          "var reader=new FileReader();" +
                          "reader.onload=function(){try{AndroidCotizador.sharePdf(String(reader.result),name,msg);resolve({shared:true,messageCopied:true,name:name});}catch(e){reject(e);}};" +
                          "reader.onerror=function(){reject(reader.error||new Error('No se pudo leer el PDF'));};" +
                          "reader.readAsDataURL(blob);" +
                          "});" +
                          "};" +
                          "}" +
                          "}" +
                          "var cur=localStorage.getItem('" + SERVICE_KEY + "');" +
                          "if(window.AndroidCotizador){AndroidCotizador.syncServiceState(cur||'');}" +
                          "}catch(e){}" +
                          "})();";

                  webView.evaluateJavascript(js, null);
              }

              private void handleServiceState(String json) {
                  try {
                      if (json == null || json.trim().isEmpty()) {
                          stopNativeTracking();
                          return;
                      }

                      JSONObject o = new JSONObject(json);
                      String status = o.optString("status", "");

                      if (!"running".equals(status)) {
                          stopNativeTracking();
                          return;
                      }

                      if (!o.has("lat") || o.isNull("lat") || !o.has("lng") || o.isNull("lng")) {
                          return;
                      }

                      long startAt = o.optLong("startAt", 0L);
                      double lat = o.optDouble("lat", Double.NaN);
                      double lng = o.optDouble("lng", Double.NaN);
                      double accuracy = o.optDouble("accuracy", 100.0);

                      if (startAt <= 0 || Double.isNaN(lat) || Double.isNaN(lng)) return;

                      SharedPreferences p = getSharedPreferences("native_tracking", MODE_PRIVATE);
                      p.edit()
                              .putBoolean("tracking_active", true)
                              .putLong("startAt", startAt)
                              .putLong("lat_bits", Double.doubleToRawLongBits(lat))
                              .putLong("lng_bits", Double.doubleToRawLongBits(lng))
                              .putLong("accuracy_bits", Double.doubleToRawLongBits(accuracy))
                              .apply();

                      if (hasFineLocation()) {
                          Intent i = new Intent(this, BackgroundLocationService.class);
                          i.putExtra("startAt", startAt);
                          i.putExtra("lat", lat);
                          i.putExtra("lng", lng);
                          i.putExtra("accuracy", accuracy);
                          startForegroundService(i);
                      }
                  } catch (Exception ignored) {
                  }
              }

              private void stopNativeTracking() {
                  getSharedPreferences("native_tracking", MODE_PRIVATE)
                          .edit()
                          .putBoolean("tracking_active", false)
                          .apply();

                  stopService(new Intent(this, BackgroundLocationService.class));
              }

              private void applyPendingAutoFinish() {
                  if (!pageReady) return;

                  SharedPreferences p = getSharedPreferences("native_tracking", MODE_PRIVATE);
                  if (!p.getBoolean("pending_auto_finish", false)) return;

                  long startAt = p.getLong("finish_startAt", 0L);
                  long endAt = p.getLong("finish_endAt", 0L);
                  double lat = Double.longBitsToDouble(p.getLong("finish_lat_bits", 0L));
                  double lng = Double.longBitsToDouble(p.getLong("finish_lng_bits", 0L));
                  double accuracy = Double.longBitsToDouble(p.getLong("finish_accuracy_bits", 0L));
                  double distance = Double.longBitsToDouble(p.getLong("finish_distance_bits", 0L));

                  String js =
                          "(function(){try{" +
                          "var raw=localStorage.getItem('" + SERVICE_KEY + "');" +
                          "if(!raw)return false;" +
                          "var st=JSON.parse(raw);" +
                          "if(st.status==='running'&&Number(st.startAt)===" + startAt + "){" +
                          "st.status='finished';" +
                          "st.endAt=" + endAt + ";" +
                          "st.autoFinished=true;" +
                          "st.autoFinishDistanceM=" + distance + ";" +
                          "st.autoFinishDetectedAt=" + endAt + ";" +
                          "st.autoFinishLat=" + lat + ";" +
                          "st.autoFinishLng=" + lng + ";" +
                          "st.autoFinishAccuracy=" + accuracy + ";" +
                          "localStorage.setItem('" + SERVICE_KEY + "',JSON.stringify(st));" +
                          "if(typeof render==='function'){render();}" +
                          "if(typeof ensureServiceAddress==='function'){setTimeout(function(){ensureServiceAddress();},150);}" +
                          "return true;}" +
                          "return false;" +
                          "}catch(e){return false;}})();";

                  webView.evaluateJavascript(js, value ->
                          p.edit().putBoolean("pending_auto_finish", false).apply()
                  );
              }

              private File savePdfToCache(String dataUrl, String requestedName) throws Exception {
                  int comma = dataUrl.indexOf(',');
                  String b64 = comma >= 0 ? dataUrl.substring(comma + 1) : dataUrl;
                  byte[] bytes = Base64.decode(b64, Base64.DEFAULT);

                  String name = requestedName == null || requestedName.trim().isEmpty()
                          ? "piOca-Cotizador.pdf"
                          : requestedName;

                  name = name.replaceAll("[\\\\/:*?\"<>|]", "_");
                  if (!name.toLowerCase().endsWith(".pdf")) name += ".pdf";

                  File dir = new File(getCacheDir(), "shared");
                  if (!dir.exists()) dir.mkdirs();

                  File file = new File(dir, name);
                  try (FileOutputStream fos = new FileOutputStream(file)) {
                      fos.write(bytes);
                  }
                  return file;
              }

              private void viewPdfNative(String dataUrl, String name) {
                  new Thread(() -> {
                      try {
                          File file = savePdfToCache(dataUrl, name);
                          Uri uri = FileProvider.getUriForFile(
                                  this,
                                  getPackageName() + ".fileprovider",
                                  file
                          );

                          runOnUiThread(() -> {
                              try {
                                  Intent view = new Intent(Intent.ACTION_VIEW);
                                  view.setDataAndType(uri, "application/pdf");
                                  view.setClipData(ClipData.newRawUri("PDF piOca", uri));
                                  view.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                                  startActivity(Intent.createChooser(view, "Ver resumen de servicio"));
                              } catch (Exception e) {
                                  Toast.makeText(
                                          this,
                                          "No se encontró una aplicación para abrir el PDF.",
                                          Toast.LENGTH_LONG
                                  ).show();
                              }
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> Toast.makeText(
                                  this,
                                  "No se pudo abrir el PDF: " + e.getMessage(),
                                  Toast.LENGTH_LONG
                          ).show());
                      }
                  }).start();
              }

              private void sharePdfNative(String dataUrl, String name, String message) {
                  new Thread(() -> {
                      try {
                          File file = savePdfToCache(dataUrl, name);
                          Uri uri = FileProvider.getUriForFile(
                                  this,
                                  getPackageName() + ".fileprovider",
                                  file
                          );

                          runOnUiThread(() -> {
                              try {
                                  String msg = message == null ? "" : message;

                                  // WhatsApp puede ignorar EXTRA_TEXT cuando recibe un PDF.
                                  // Lo enviamos igual y, además, dejamos el mensaje en el
                                  // portapapeles nativo para que nunca se pierda.
                                  if (!msg.isEmpty()) {
                                      android.content.ClipboardManager clipboard =
                                              (android.content.ClipboardManager)
                                                      getSystemService(CLIPBOARD_SERVICE);

                                      if (clipboard != null) {
                                          clipboard.setPrimaryClip(
                                                  ClipData.newPlainText("Mensaje piOca", msg)
                                          );
                                      }
                                  }

                                  Intent send = new Intent(Intent.ACTION_SEND);
                                  send.setType("application/pdf");
                                  send.putExtra(Intent.EXTRA_STREAM, uri);

                                  if (!msg.isEmpty()) {
                                      send.putExtra(Intent.EXTRA_TEXT, msg);
                                      send.putExtra(
                                              Intent.EXTRA_SUBJECT,
                                              "Resumen de servicio piOca®"
                                      );
                                  }

                                  ClipData clip = ClipData.newRawUri("PDF piOca", uri);
                                  if (!msg.isEmpty()) {
                                      clip.addItem(new ClipData.Item(msg));
                                  }
                                  send.setClipData(clip);

                                  send.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                                  send.addFlags(Intent.FLAG_ACTIVITY_NEW_DOCUMENT);

                                  if (!msg.isEmpty()) {
                                      Toast.makeText(
                                              this,
                                              "Mensaje copiado. Si WhatsApp no lo inserta, pegalo en el chat.",
                                              Toast.LENGTH_LONG
                                      ).show();
                                  }

                                  startActivity(
                                          Intent.createChooser(
                                                  send,
                                                  "Compartir resumen de servicio"
                                          )
                                  );
                              } catch (Exception e) {
                                  Toast.makeText(
                                          this,
                                          "No se pudo abrir el menú para compartir.",
                                          Toast.LENGTH_LONG
                                  ).show();
                              }
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> Toast.makeText(
                                  this,
                                  "No se pudo compartir el PDF: " + e.getMessage(),
                                  Toast.LENGTH_LONG
                          ).show());
                      }
                  }).start();
              }

              private void saveFileNative(String dataUrl, String requestedName, String mimeType) {
                  new Thread(() -> {
                      try {
                          int comma = dataUrl.indexOf(',');
                          String b64 = comma >= 0 ? dataUrl.substring(comma + 1) : dataUrl;
                          byte[] bytes = Base64.decode(b64, Base64.DEFAULT);
                          String name = requestedName == null || requestedName.trim().isEmpty()
                                  ? "Catalogo_piOca.xlsx"
                                  : requestedName.replaceAll("[\\\\/:*?\"<>|]", "_");
                          String type = mimeType == null || mimeType.trim().isEmpty()
                                  ? "application/octet-stream"
                                  : mimeType;

                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.Downloads.DISPLAY_NAME, name);
                              values.put(MediaStore.Downloads.MIME_TYPE, type);
                              values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/piOca");
                              values.put(MediaStore.Downloads.IS_PENDING, 1);
                              Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                              if (uri == null) throw new Exception("No se pudo crear el archivo");
                              try (OutputStream out = getContentResolver().openOutputStream(uri)) {
                                  if (out == null) throw new Exception("No se pudo abrir el archivo");
                                  out.write(bytes);
                              }
                              values.clear();
                              values.put(MediaStore.Downloads.IS_PENDING, 0);
                              getContentResolver().update(uri, values, null, null);
                          } else {
                              File dir = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
                              if (dir == null) dir = getFilesDir();
                              File file = new File(dir, name);
                              try (FileOutputStream fos = new FileOutputStream(file)) {
                                  fos.write(bytes);
                              }
                          }

                          runOnUiThread(() -> Toast.makeText(
                                  this,
                                  "Catálogo guardado en Descargas/piOca",
                                  Toast.LENGTH_LONG
                          ).show());
                      } catch (Exception e) {
                          runOnUiThread(() -> Toast.makeText(
                                  this,
                                  "No se pudo guardar el catálogo: " + e.getMessage(),
                                  Toast.LENGTH_LONG
                          ).show());
                      }
                  }).start();
              }

              public class NativeBridge {
                  @JavascriptInterface
                  public void syncServiceState(String json) {
                      runOnUiThread(() -> handleServiceState(json));
                  }

                  @JavascriptInterface
                  public void viewPdf(String dataUrl, String fileName) {
                      viewPdfNative(dataUrl, fileName);
                  }

                  @JavascriptInterface
                  public void sharePdf(String dataUrl, String fileName, String message) {
                      sharePdfNative(dataUrl, fileName, message);
                  }

                  @JavascriptInterface
                  public void saveFile(String dataUrl, String fileName, String mimeType) {
                      saveFileNative(dataUrl, fileName, mimeType);
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (pageReady) {
                      installNativeHooks();
                      applyPendingAutoFinish();
                  }
                  webView.postDelayed(this::beginPermissionFlow, 500);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  try {
                      unregisterReceiver(autoFinishReceiver);
                  } catch (Exception ignored) {
                  }
                  super.onDestroy();
              }
          }
