          cat > android-cotizador/app/src/main/java/ar/com/pioca/cotizador/BackgroundLocationService.java <<'EOF'
          package ar.com.pioca.cotizador;

          import android.Manifest;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.IBinder;

          public class BackgroundLocationService extends Service implements LocationListener {

              private static final String CHANNEL_ID = "pioca_cotizador_servicio";
              private static final int NOTIFICATION_ID = 1717;
              private static final long CHECK_MS = 120000L;
              private static final double STOP_DISTANCE_M = 200.0;
              private static final double MAX_ACCURACY_M = 100.0;

              private LocationManager locationManager;
              private long startAt;
              private double startLat;
              private double startLng;
              private double startAccuracy;
              private long lastCheckAt = 0L;

              @Override
              public void onCreate() {
                  super.onCreate();
                  createChannel();
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  SharedPreferences p = getSharedPreferences("native_tracking", MODE_PRIVATE);

                  if (intent != null && intent.hasExtra("startAt")) {
                      startAt = intent.getLongExtra("startAt", 0L);
                      startLat = intent.getDoubleExtra("lat", Double.NaN);
                      startLng = intent.getDoubleExtra("lng", Double.NaN);
                      startAccuracy = intent.getDoubleExtra("accuracy", 100.0);
                  } else if (p.getBoolean("tracking_active", false)) {
                      startAt = p.getLong("startAt", 0L);
                      startLat = Double.longBitsToDouble(p.getLong("lat_bits", 0L));
                      startLng = Double.longBitsToDouble(p.getLong("lng_bits", 0L));
                      startAccuracy = Double.longBitsToDouble(p.getLong("accuracy_bits", 0L));
                  } else {
                      stopSelf();
                      return START_NOT_STICKY;
                  }

                  startForeground(NOTIFICATION_ID, buildNotification());
                  beginLocationUpdates();
                  return START_STICKY;
              }

              private void createChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel c = new NotificationChannel(
                              CHANNEL_ID,
                              "Servicio activo piOca",
                              NotificationManager.IMPORTANCE_LOW
                      );
                      c.setDescription("Control de ubicación mientras hay un servicio activo");
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) nm.createNotificationChannel(c);
                  }
              }

              private Notification buildNotification() {
                  Intent open = new Intent(this, MainActivity.class);
                  open.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);

                  PendingIntent pi = PendingIntent.getActivity(
                          this,
                          0,
                          open,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  return new Notification.Builder(this, CHANNEL_ID)
                          .setSmallIcon(R.mipmap.ic_launcher)
                          .setContentTitle("piOca Cotizador · servicio activo")
                          .setContentText("Controlando ubicación para finalizar el servicio al alejarte.")
                          .setContentIntent(pi)
                          .setOngoing(true)
                          .setCategory(Notification.CATEGORY_SERVICE)
                          .build();
              }

              private void beginLocationUpdates() {
                  if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)
                          != PackageManager.PERMISSION_GRANTED) {
                      stopSelf();
                      return;
                  }

                  if (locationManager == null) {
                      locationManager = (LocationManager) getSystemService(LOCATION_SERVICE);
                  }

                  if (locationManager == null) return;

                  try {
                      if (locationManager.isProviderEnabled(LocationManager.GPS_PROVIDER)) {
                          locationManager.requestLocationUpdates(
                                  LocationManager.GPS_PROVIDER,
                                  CHECK_MS,
                                  20f,
                                  this
                          );
                      }
                  } catch (Exception ignored) {
                  }

                  try {
                      if (locationManager.isProviderEnabled(LocationManager.NETWORK_PROVIDER)) {
                          locationManager.requestLocationUpdates(
                                  LocationManager.NETWORK_PROVIDER,
                                  CHECK_MS,
                                  20f,
                                  this
                          );
                      }
                  } catch (Exception ignored) {
                  }
              }

              @Override
              public void onLocationChanged(Location location) {
                  if (location == null) return;

                  long now = System.currentTimeMillis();
                  if (lastCheckAt > 0 && now - lastCheckAt < CHECK_MS - 5000L) return;
                  lastCheckAt = now;

                  double currentAccuracy = location.hasAccuracy()
                          ? Math.max(0.0, location.getAccuracy())
                          : MAX_ACCURACY_M;

                  double safeStartAccuracy = Math.max(0.0, startAccuracy);

                  if (safeStartAccuracy > MAX_ACCURACY_M || currentAccuracy > MAX_ACCURACY_M) {
                      return;
                  }

                  double rawDistance = distanceMeters(
                          startLat,
                          startLng,
                          location.getLatitude(),
                          location.getLongitude()
                  );

                  double conservativeDistance =
                          rawDistance
                                  - Math.min(safeStartAccuracy, MAX_ACCURACY_M)
                                  - Math.min(currentAccuracy, MAX_ACCURACY_M);

                  if (conservativeDistance >= STOP_DISTANCE_M) {
                      saveAutoFinish(location, rawDistance);
                      sendBroadcast(
                              new Intent(MainActivity.ACTION_AUTO_FINISH)
                                      .setPackage(getPackageName())
                      );
                      stopSelf();
                  }}}

              private void saveAutoFinish(Location location, double rawDistance) {
                  long endAt = System.currentTimeMillis();

                  getSharedPreferences("native_tracking", MODE_PRIVATE)
                          .edit()
                          .putBoolean("tracking_active", false)
                          .putBoolean("pending_auto_finish", true)
                          .putLong("finish_startAt", startAt)
                          .putLong("finish_endAt", endAt)
                          .putLong("finish_lat_bits", Double.doubleToRawLongBits(location.getLatitude()))
                          .putLong("finish_lng_bits", Double.doubleToRawLongBits(location.getLongitude()))
                          .putLong("finish_accuracy_bits", Double.doubleToRawLongBits(location.getAccuracy()))
                          .putLong("finish_distance_bits", Double.doubleToRawLongBits(rawDistance))
                          .apply();
              }

              private static double distanceMeters(
                      double lat1,
                      double lon1,
                      double lat2,
                      double lon2) {

                  double earth = 6371000.0;
                  double p1 = Math.toRadians(lat1);
                  double p2 = Math.toRadians(lat2);
                  double dp = Math.toRadians(lat2 - lat1);
                  double dl = Math.toRadians(lon2 - lon1);

                  double a =
                          Math.sin(dp / 2.0) * Math.sin(dp / 2.0)
                                  + Math.cos(p1) * Math.cos(p2)
                                  * Math.sin(dl / 2.0) * Math.sin(dl / 2.0);

                  double c = 2.0 * Math.atan2(Math.sqrt(a), Math.sqrt(1.0 - a));
                  return earth * c;
              }

              @Override
              public void onProviderEnabled(String provider) {
              }

              @Override
              public void onProviderDisabled(String provider) {
              }

              @Override
              public void onStatusChanged(String provider, int status, Bundle extras) {
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public void onDestroy() {
                  if (locationManager != null) {
                      try {
                          locationManager.removeUpdates(this);
                      } catch (Exception ignored) {
                      }
                  }
                  super.onDestroy();
              }
          }
