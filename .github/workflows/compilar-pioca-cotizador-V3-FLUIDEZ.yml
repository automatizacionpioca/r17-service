      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK 35
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER" || { echo 'ERROR: SDK Manager no encontrado'; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar dependencias de validación
        shell: bash
        run: |
          python3 -m pip install --quiet pyyaml pillow
          python3 -m py_compile /tmp/pioca_cotizador_v3_fluidez.py
          python3 /tmp/pioca_cotizador_v3_fluidez.py verify

      - name: Verificar firma de publicación existente
        shell: bash
        env:
          COTIZADOR_KEYSTORE_B64: ${{ secrets.COTIZADOR_KEYSTORE_B64 }}
          COTIZADOR_KEYSTORE_PASS: ${{ secrets.COTIZADOR_KEYSTORE_PASS }}
        run: |
          set -e
          test -n "$COTIZADOR_KEYSTORE_B64" || { echo 'ERROR: falta el keystore original, no se permite compilar con firma nueva'; exit 1; }
          test -n "$COTIZADOR_KEYSTORE_PASS" || { echo 'ERROR: falta password del keystore original'; exit 1; }
          test -f icon-cotizador-pioca.png

      - name: Crear Android original V2 completo sin alterar GPS ni PDF
        shell: bash
        run: |
          set -e
          python3 /tmp/pioca_cotizador_v3_fluidez.py build-base

      - name: Aplicar R17 V3 WebView y versionCode 3
        shell: bash
        run: |
          set -e
          python3 /tmp/pioca_cotizador_v3_fluidez.py patch-native
          grep -q "versionCode 3" android-cotizador/app/build.gradle
          grep -q "applicationId 'ar.com.pioca.cotizador'" android-cotizador/app/build.gradle
          grep -q 'onRenderProcessGone' android-cotizador/app/src/main/java/ar/com/pioca/cotizador/MainActivity.java
          grep -q 'postVisualStateCallback' android-cotizador/app/src/main/java/ar/com/pioca/cotizador/MainActivity.java
          grep -q 'class BackgroundLocationService' android-cotizador/app/src/main/java/ar/com/pioca/cotizador/BackgroundLocationService.java

      - name: Preparar HTML optimizados desde originales sin publicarlos aún
        shell: bash
        run: |
          set -e
          python3 /tmp/pioca_cotizador_v3_fluidez.py patch-web
          node --check r17-v3-web-ready/r17-pdf.js
          node --check r17-v3-web-ready/r17-catalog.js
          python3 - <<'PY'
          import re,subprocess
          from pathlib import Path
          for p in ['index.html','log.html','cfg.html']:
              html=Path('r17-v3-web-ready')/p
              content=html.read_text('utf8')
              scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',content,re.I)
              for i,js in enumerate(scripts):
                  q=Path('/tmp/r17-check-'+p+'-'+str(i)+'.js')
                  q.write_text(js,encoding='utf8')
                  subprocess.run(['node','--check',str(q)],check=True)
          print('OK: sintaxis de HTML y módulos JS V3')
          PY

      - name: Restaurar firma original para actualización
        shell: bash
        env:
          COTIZADOR_KEYSTORE_B64: ${{ secrets.COTIZADOR_KEYSTORE_B64 }}
        run: |
          set -e
          printf '%s' "$COTIZADOR_KEYSTORE_B64" | base64 --decode > android-cotizador/pioca-cotizador-release.jks
          test -s android-cotizador/pioca-cotizador-release.jks

      - name: Compilar APK R17 V3 release firmada
        working-directory: android-cotizador
        env:
          COTIZADOR_KEYSTORE_PATH: ../pioca-cotizador-release.jks
          COTIZADOR_KEYSTORE_PASS: ${{ secrets.COTIZADOR_KEYSTORE_PASS }}
        run: |
          gradle :app:assembleRelease --no-daemon

      - name: Preparar APK descargable
        shell: bash
        run: |
          set -e
          cp android-cotizador/app/build/outputs/apk/release/app-release.apk piOca-Cotizador-R17-V3-FLUIDEZ.apk
          test -s piOca-Cotizador-R17-V3-FLUIDEZ.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging piOca-Cotizador-R17-V3-FLUIDEZ.apk | grep '^package:'

      - name: Subir APK V3
        uses: actions/upload-artifact@v4
        with:
          name: piOca-Cotizador-R17-V3-FLUIDEZ-APK
          path: piOca-Cotizador-R17-V3-FLUIDEZ.apk
          retention-days: 90

      - name: Subir respaldos de HTML optimizados
        uses: actions/upload-artifact@v4
        with:
          name: piOca-Cotizador-R17-V3-HTML-OPTIMIZADOS
          path: r17-v3-web-ready/
          retention-days: 90

      - name: Publicar HTML optimizados solamente tras compilación verde
        if: ${{ inputs.publicar_web == true }}
        shell: bash
        run: |
          set -e
          for file in index.html log.html cfg.html r17-pdf.js r17-catalog.js; do
            cp "r17-v3-web-ready/$file" "$file"
          done
          git config user.name 'piOca Cotizador Build'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html log.html cfg.html r17-pdf.js r17-catalog.js
          if ! git diff --staged --quiet; then
            git commit -m 'R17 V3: PDF y Excel bajo demanda para mejorar fluidez'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
